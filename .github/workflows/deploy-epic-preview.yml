name: deploy-epic-preview

on:
  push:
    branches: ["epic/73-redesign"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to publish to the epic-73 preview"
        required: true
        default: "epic/73-redesign"

permissions:
  contents: read

concurrency:
  group: deploy-epic-73
  cancel-in-progress: false

jobs:
  deploy:
    # Repo-level DOCS_DEPLOY_KEY is the staging key. Do not bind
    # environment: production — that environment holds isolated prod
    # secrets this job must not consume.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record target sha
        run: |
          echo "DEV_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEV_BRANCH=${{ inputs.ref || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zedtech/zedkit-docs build
      - name: Configure SSH to deploy host
        # Reuse DOCS_DEPLOY_KEY (the docs-ci pubkey is authorized on the deploy host).
        # Do not use DOCS_DEPLOY_HOST / DOCS_DEPLOY_USER / DOCS_DEPLOY_KNOWN_HOSTS:
        # those still point at the production docs VM (zedkit.app).
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '195.154.208.75 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDPESq5xmwyuPt3alDGhEe9fE3oOmCDPBt70I8hhylnE' > ~/.ssh/known_hosts
          printf 'Host zed-dev\n  HostName 195.154.208.75\n  User zed\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Publish static export
        run: bash deploy/publish-dev-static.sh zed-dev zed-epic-73
      - name: Verify epic-73 build stamp
        run: |
          host="epic-73.dev.zedkit.app"
          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::warning::$host does not resolve yet; skipping live stamp check"
            exit 0
          fi
          for _ in $(seq 1 8); do
            if curl -sf "https://${host}/dev-build.txt" | grep -qx "commit=$DEV_SHA"; then
              exit 0
            fi
            sleep 6
          done
          echo "dev-build.txt does not show commit $DEV_SHA" >&2
          curl -sS "https://${host}/dev-build.txt" >&2 || true
          exit 1

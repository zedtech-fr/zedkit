name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-artifacts.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Sequential phases: build output is read by later phases.
      - run: pnpm exec turbo run typecheck lint
      - run: pnpm exec turbo run build
      - run: pnpm exec turbo run test
      # Versioning dry-run only: publishing to npm is a later, explicit
      # decision. This just proves the Changesets metadata is sane.
      - run: pnpm run changeset:status

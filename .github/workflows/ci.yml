name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# One group per PR (or per ref on push). Cancel only superseded pull_request
# runs — never a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same-repo PRs into `dev` run checks, registry and docs-build on the
# self-hosted zedkit runner (persistent /runner-cache + TURBO_CACHE_DIR).
# Docs Playwright smoke and the UI gallery screenshots always run on
# ubuntu-latest (the host the PNG baselines were taken on). Forks, PRs
# into `main`, and pushes stay on ubuntu-latest.
# Release/deploy workflows are separate and untouched.

jobs:
  # Scope of this run (scripts/ci-affected.mjs). Full CI runs only for pushes
  # and PRs targeting main. Every other PR, lockfile / root config / workflow
  # changes included, runs affected-only: turbo filters, plus path gates on
  # the docs and registry jobs. ci-required accepts `skipped` only when
  # the detector excluded that job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.detect.outputs.full }}
      workflow_only: ${{ steps.detect.outputs.workflow_only }}
      workflows: ${{ steps.detect.outputs.workflows }}
      docs: ${{ steps.detect.outputs.docs }}
      registry: ${{ steps.detect.outputs.registry }}
      ui: ${{ steps.detect.outputs.ui }}
      packages: ${{ steps.detect.outputs.packages }}
      filter: ${{ steps.detect.outputs.filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect scope
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD~1"
          fi
          git diff --name-only --no-renames "$base"...HEAD 2>/dev/null |
            node scripts/ci-affected.mjs --event "$EVENT" --base-ref "$BASE_REF" | tee -a "$GITHUB_OUTPUT"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: actionlint and yamllint on changed workflow files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD -- '.github/workflows/')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow files in diff; skipping actionlint/yamllint."
            exit 0
          fi
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz | tar xz
          ./actionlint "${files[@]}"
          python3 -m pip install --disable-pip-version-check yamllint==1.35.1
          yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable}}" "${files[@]}"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-no-artifacts.sh
      - run: bash scripts/check-no-private-refs.sh
      - run: bash scripts/check-tone.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-dependabot.sh
      - run: bash scripts/check-breaking-changeset.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-changeset-packages.sh

  checks:
    runs-on: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","zedkit"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    env:
      # Empty on the full path (pushes, PRs into main); otherwise turbo runs
      # only the changed packages and their dependents.
      FILTER: ${{ needs.changes.outputs.filter }}
      BASE_REF: ${{ github.base_ref }}
      FULL: ${{ needs.changes.outputs.full }}
      DOCS: ${{ needs.changes.outputs.docs }}
      PACKAGES: ${{ needs.changes.outputs.packages }}
    steps:
      - name: Self-hosted runner env
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p /runner-cache/{pnpm,nm,tsbuildinfo,eslint,turbo,npm,xdg}
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright"
            echo "npm_config_store_dir=/runner-cache/pnpm"
            echo "npm_config_cache=/runner-cache/npm"
            echo "TURBO_CACHE_DIR=/runner-cache/turbo"
            echo "RUNNER_TOOL_CACHE=/tmp/runner-tool-cache"
            echo "XDG_CACHE_HOME=/runner-cache/xdg"
            echo "TURBO_CONCURRENCY=4"
            echo "VITEST_MAX_WORKERS=2"
            echo "VITEST_MAX_FORKS=2"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          # changeset status diffs against origin/main (see baseBranch in
          # .changeset/config.json); a shallow clone, or no local main
          # branch, breaks it.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v7
        if: runner.environment == 'self-hosted'
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: runner.environment != 'self-hosted'
      - name: pnpm install (store + nm archive)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh install
      - name: Restore tsbuildinfo
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh restore-ts
      - run: bash scripts/check-deps-audit.sh
      - run: node scripts/check-publish-engines.mjs
      - run: bash scripts/check-registry-ui-drift.sh
      - uses: actions/cache@v6
        if: runner.environment != 'self-hosted'
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Sequential phases: build output is read by later phases.
      - name: typecheck and lint
        run: |
          extra=()
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            extra+=(--cache-dir=/runner-cache/turbo)
          fi
          pnpm exec turbo run typecheck lint ${FILTER:+"$FILTER"} "${extra[@]}"
      - name: Save tsbuildinfo
        if: always() && runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh save-ts
      # Smoke-test the shared ESLint config itself: with zero packages turbo
      # runs no lint task, so a broken config would otherwise stay green.
      # Affected path: lint the changed files, and the whole repo only when
      # the config itself changed.
      - name: ESLint
        run: |
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            bash scripts/ci-eslint.sh --cache --cache-location /runner-cache/eslint/.eslintcache
          else
            bash scripts/ci-eslint.sh --cache --cache-location .eslintcache
          fi
      # catalog:check (docs check.mjs) always builds seo/ai/ui (admin tutorial
      # spawns ui build). Build only those packages; turbo ^build pulls i18n/
      # core/quality. Avoids building all 16 when DOCS=true. Persistent
      # TURBO_CACHE_DIR on self-hosted keeps repeats warm.
      - name: Build (catalog deps)
        if: env.FULL == 'true' || env.DOCS == 'true'
        run: |
          extra=()
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            extra+=(--cache-dir=/runner-cache/turbo)
          fi
          pnpm exec turbo run build \
            --filter=@zedtech/zedkit-seo \
            --filter=@zedtech/zedkit-ai \
            --filter=@zedtech/zedkit-ui \
            "${extra[@]}"
      - name: catalog:check
        if: env.FULL == 'true' || env.DOCS == 'true'
        run: pnpm run catalog:check
      # Remaining package builds feed API report / pack. Skip when no
      # package (or tsconfig.base) changed: the reports cannot drift.
      # Docs static export lives in docs-build.
      - name: Build
        if: env.FULL == 'true' || env.PACKAGES == 'true'
        run: |
          extra=()
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            extra+=(--cache-dir=/runner-cache/turbo)
          fi
          pnpm exec turbo run build --filter='!@zedtech/zedkit-docs' "${extra[@]}"
      - name: API report
        if: env.FULL == 'true' || env.PACKAGES == 'true'
        run: bash scripts/check-api-report.sh
      - name: Pack
        if: env.FULL == 'true' || env.PACKAGES == 'true'
        run: bash scripts/check-pack.sh
      - run: bash scripts/check-e2e-registered.sh
      - name: test
        run: |
          extra=()
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            extra+=(--cache-dir=/runner-cache/turbo)
          fi
          pnpm exec turbo run test ${FILTER:+"$FILTER"} "${extra[@]}"
      - name: Kit markdown prettier
        run: pnpm --filter @zedtech/zedkit-ai run kit:md
      - name: AI generated drift (built CLI)
        run: |
          pnpm exec turbo run build --filter=@zedtech/zedkit-ai
          node packages/ai/dist/bin.js sync --check
      # Workspace-wide thresholds, and it reruns every test: full path only.
      - name: Coverage (vitest v8)
        if: env.FULL == 'true'
        run: pnpm test:coverage
      - name: Coverage summary
        if: always() && env.FULL == 'true'
        run: |
          test -f coverage/coverage-summary.json || exit 0
          node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && env.FULL == 'true'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      # deploy/* needs Docker + rsync; Self-hosted runners drop privileges and
      # do not mount docker.sock — keep those tests on github-hosted only.
      - name: test:registry
        if: runner.environment != 'self-hosted'
        run: pnpm test:registry
      - name: test:registry (exclude deploy/*)
        if: runner.environment == 'self-hosted'
        run: |
          node --test \
            scripts/registry/*.test.mjs \
            scripts/dts-api-report.test.mjs \
            scripts/check-api-report.test.mjs \
            scripts/catalog-states.test.mjs \
            scripts/catalog-maturity.test.mjs \
            scripts/catalog-adoption.test.mjs \
            scripts/adoption-shown-commands.test.mjs \
            scripts/adoption-smoke.test.mjs \
            scripts/changeset-status-needed.test.mjs \
            scripts/coverage-summary.test.mjs \
            scripts/release-tags-wait.test.mjs \
            scripts/require-green-ci.test.mjs \
            scripts/ci-affected.test.mjs \
            scripts/ci-hygiene.test.mjs \
            apps/docs/scripts/*.test.mjs
      # Versioning dry-run only: proves the Changesets metadata is sane.
      # Skipped on the Version PR itself: it consumed the changesets, so
      # `status` always reports "changed packages, no changesets" there.
      # Also skipped when packages/apps already match origin/main (a
      # main→preview back-merge): commit-range status still sees bumps
      # from the diverged history, with nothing left to publish.
      # And skipped for a Gitflow `dev`→`main` promotion of that same
      # consumed version delta (package.json version / internal-dep bumps
      # + CHANGELOG only). Source edits or package.json script / external
      # dependency changes without a changeset still run `status` and fail.
      - name: Changeset status
        if: github.head_ref != 'changeset-release/main'
        run: |
          if git diff --quiet origin/main HEAD -- packages apps; then
            echo "packages/apps match origin/main; skip changeset status"
          elif [ "$(node scripts/changeset-status-needed.mjs)" = "skip-version-delta" ]; then
            echo "consumed Changesets version delta vs origin/main; skip changeset status"
          else
            pnpm run changeset:status
          fi
      - name: Cache disk report
        if: always() && runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh disk-report

  # Gallery screenshots (gallery-*-linux.png) were taken on GitHub-hosted
  # Ubuntu + the Chromium Playwright 1.64.1 installs. The Dedibox image
  # browser is a different revision and fails maxDiffPixelRatio: 0.02.
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-ui
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm --filter @zedtech/zedkit-ui smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-gallery
          path: packages/ui/test-results/*.png
          if-no-files-found: ignore

  registry-smoke:
    runs-on: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","zedkit"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.registry == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - name: Self-hosted runner env
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p /runner-cache/{pnpm,nm,tsbuildinfo,eslint,turbo,npm,xdg}
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright"
            echo "npm_config_store_dir=/runner-cache/pnpm"
            echo "npm_config_cache=/runner-cache/npm"
            echo "TURBO_CACHE_DIR=/runner-cache/turbo"
            echo "RUNNER_TOOL_CACHE=/tmp/runner-tool-cache"
            echo "XDG_CACHE_HOME=/runner-cache/xdg"
            echo "TURBO_CONCURRENCY=4"
            echo "VITEST_MAX_WORKERS=4"
            echo "VITEST_MAX_FORKS=4"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v7
        if: runner.environment == 'self-hosted'
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: runner.environment != 'self-hosted'
      - name: pnpm install (store + nm archive)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh install
      - run: pnpm registry:build
      # Two Next smokes; Vite paths live in the dedicated quickstart-smoke job.
      - name: registry smoke
        run: |
          fail=0
          bash scripts/registry/smoke-shadcn-add.sh &
          p1=$!
          bash scripts/registry/smoke-ui-quickstart.sh &
          p2=$!
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          exit "$fail"

  quickstart-smoke:
    runs-on: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","zedkit"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.registry == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - name: Self-hosted runner env
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p /runner-cache/{pnpm,nm,tsbuildinfo,eslint,turbo,npm,xdg}
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright"
            echo "npm_config_store_dir=/runner-cache/pnpm"
            echo "npm_config_cache=/runner-cache/npm"
            echo "TURBO_CACHE_DIR=/runner-cache/turbo"
            echo "RUNNER_TOOL_CACHE=/tmp/runner-tool-cache"
            echo "XDG_CACHE_HOME=/runner-cache/xdg"
            echo "TURBO_CONCURRENCY=4"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v7
        if: runner.environment == 'self-hosted'
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: runner.environment != 'self-hosted'
      - name: pnpm install (store + nm archive)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh install
      - name: Build UI
        run: |
          extra=()
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            extra+=(--cache-dir=/runner-cache/turbo)
          fi
          pnpm exec turbo run build --filter=@zedtech/zedkit-ui "${extra[@]}"
      - run: pnpm registry:build
      - name: Playwright browsers (image)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh playwright
      - name: quickstart smoke
        run: |
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            # shellcheck disable=SC2016
            sed -i 's/${CI:+--with-deps}//' scripts/quickstart-smoke.sh
          fi
          bash scripts/quickstart-smoke.sh
        env:
          QUICKSTART_PREBUILT: "1"

  # Follows the adoption instructions the site shows (home, getting-started, component pages), and nothing else,
  # in clean Next.js projects: install Button, copy Button and Drawer by CLI and by hand, Theme, Motion, the
  # getting-started package adds, plus a negative control that must fail. Not in ci-required until it has been
  # stable on main for a while.
  adoption-smoke:
    runs-on: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","zedkit"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.registry == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - name: Self-hosted runner env
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p /runner-cache/{pnpm,nm,tsbuildinfo,eslint,turbo,npm,xdg}
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright"
            echo "npm_config_store_dir=/runner-cache/pnpm"
            echo "npm_config_cache=/runner-cache/npm"
            echo "TURBO_CACHE_DIR=/runner-cache/turbo"
            echo "RUNNER_TOOL_CACHE=/tmp/runner-tool-cache"
            echo "XDG_CACHE_HOME=/runner-cache/xdg"
            echo "TURBO_CONCURRENCY=4"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v7
        if: runner.environment == 'self-hosted'
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: runner.environment != 'self-hosted'
      - name: pnpm install (store + nm archive)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh install
      - run: pnpm registry:build
      - uses: actions/cache@v6
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        if: runner.environment != 'self-hosted'
      - name: Playwright browsers (image)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh playwright
      - run: pnpm adoption:smoke

  # One Next export for Playwright smoke, SEO and the first-load budget.
  # Smoke downloads `apps/docs/out` instead of exporting again.
  docs-build:
    runs-on: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","zedkit"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - name: Self-hosted runner env
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p /runner-cache/{pnpm,nm,tsbuildinfo,eslint,turbo,npm,xdg}
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright"
            echo "npm_config_store_dir=/runner-cache/pnpm"
            echo "npm_config_cache=/runner-cache/npm"
            echo "TURBO_CACHE_DIR=/runner-cache/turbo"
            echo "RUNNER_TOOL_CACHE=/tmp/runner-tool-cache"
            echo "XDG_CACHE_HOME=/runner-cache/xdg"
            echo "TURBO_CONCURRENCY=4"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v7
        if: runner.environment == 'self-hosted'
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: runner.environment != 'self-hosted'
      - name: pnpm install (store + nm archive)
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-runner-cache.sh install
      - uses: actions/cache@v6
        if: runner.environment != 'self-hosted'
        with:
          path: .turbo
          key: turbo-docs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-docs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build docs
        run: |
          extra=()
          if [ "${RUNNER_ENVIRONMENT}" = "self-hosted" ]; then
            extra+=(--cache-dir=/runner-cache/turbo)
          fi
          pnpm exec turbo run build --filter=@zedtech/zedkit-docs "${extra[@]}"
      - name: Docs static export SEO check
        run: node apps/docs/scripts/check-seo-export.mjs
      - name: Docs home first-load JS budget
        run: node apps/docs/scripts/check-first-load-budget.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: docs-out
          path: apps/docs/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Critical browser journeys only (home, search, catalog, a component
  # page, getting-started). Visual matrices and the sitemap axe sweep are
  # not a merge gate: catalog:check, SEO export and first-load cover the rest.
  docs-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, docs-build]
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter="@zedtech/zedkit-docs..."
      - uses: actions/download-artifact@v8
        with:
          name: docs-out
          path: apps/docs/out
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-start.log 2>&1 &
          echo $! > /tmp/docs.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sf http://127.0.0.1:3100/ | grep -q 'data-home-hero'
          curl -sf -o /dev/null http://127.0.0.1:3100/docs
          curl -sf -o /dev/null http://127.0.0.1:3100/api/search
          curl -sf -o /dev/null http://127.0.0.1:3100/robots.txt
          curl -sf -o /dev/null http://127.0.0.1:3100/sitemap.xml
          curl -sf -o /dev/null http://127.0.0.1:3100/llms.txt
          pnpm --filter @zedtech/zedkit-docs run smoke
          kill "$(cat /tmp/docs.pid)"
        env:
          DOCS_E2E_PROJECT: chromium
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: docs-home-smoke
          path: apps/docs/test-results/*.png
          if-no-files-found: ignore

  # Stable check name for older rulesets. The browser suite is docs-smoke.
  docs-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, docs-smoke]
    if: always() && needs.changes.outputs.docs == 'true' && needs.changes.outputs.workflow_only != 'true'
    steps:
      - name: Smoke passed
        run: test "${{ needs.docs-smoke.result }}" = "success"

  # Stable check name for branch protection. Require this one job instead of
  # listing every CI job. The ruleset still lists the old names until an
  # admin applies the settings issue.
  # Selected jobs must succeed. Skipped is allowed only when `changes`
  # excluded that job. Failure, cancel, unknown and missing never pass.
  ci-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, hygiene, workflow-lint, checks, ui-smoke, registry-smoke, docs-build, docs-e2e, docs-smoke]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Selected jobs succeeded; skipped only when excluded
        env:
          CHANGES: ${{ needs.changes.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          CHECKS: ${{ needs.checks.result }}
          UI_SMOKE: ${{ needs.ui-smoke.result }}
          REGISTRY: ${{ needs.registry-smoke.result }}
          DOCS_BUILD: ${{ needs.docs-build.result }}
          DOCS_E2E: ${{ needs.docs-e2e.result }}
          DOCS_SMOKE: ${{ needs.docs-smoke.result }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          DOCS: ${{ needs.changes.outputs.docs }}
          REGISTRY_SCOPE: ${{ needs.changes.outputs.registry }}
          UI_SCOPE: ${{ needs.changes.outputs.ui }}
          WORKFLOW_ONLY: ${{ needs.changes.outputs.workflow_only }}
        run: node scripts/ci-required.mjs

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-artifacts.sh
      - run: bash scripts/check-no-private-refs.sh
      - run: bash scripts/check-tone.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-breaking-changeset.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-pr-lenses.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status diffs against origin/main (see baseBranch in
          # .changeset/config.json); a shallow clone, or no local main
          # branch, breaks it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Sequential phases: build output is read by later phases.
      - run: pnpm exec turbo run typecheck lint
      # Smoke-test the shared ESLint config itself: with zero packages turbo
      # runs no lint task, so a broken config would otherwise stay green.
      - run: pnpm exec eslint .
      - run: pnpm run catalog:check
      - run: pnpm exec turbo run build
      - name: Docs static export artifacts
        run: |
          test -f apps/docs/out/robots.txt
          test -f apps/docs/out/sitemap.xml
          test -f apps/docs/out/llms.txt
      - run: bash scripts/check-pack.sh
      - run: pnpm exec turbo run test
      - run: pnpm test:registry
      # Gallery smoke: real chromium over the built ui gallery (both
      # themes, zero console errors), screenshots kept as artifacts.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @zedtech/zedkit-ui smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ui-gallery
          path: packages/ui/test-results/*.png
      # Versioning dry-run only: proves the Changesets metadata is sane.
      # Skipped on the Version PR itself: it consumed the changesets, so
      # `status` always reports "changed packages, no changesets" there.
      - run: pnpm run changeset:status
        if: github.head_ref != 'changeset-release/main'

  registry-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - run: pnpm registry:smoke

  docs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Scoped build (turbo builds workspace deps first), then serve the
      # static export (apps/docs/out, same files Caddy serves in prod)
      # and prove the home renders with live demos.
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-start.log 2>&1 &
          echo $! > /tmp/docs.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sf http://127.0.0.1:3100/ | grep -q "Create app"
          curl -sf -o /dev/null http://127.0.0.1:3100/docs
          curl -sf -o /dev/null http://127.0.0.1:3100/api/search
          pnpm --filter @zedtech/zedkit-docs run smoke
          kill "$(cat /tmp/docs.pid)"

name: deploy-docs

on:
  push:
    branches: ["main"]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "docs/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zedtech/zedkit-docs build
      - name: Write suggest env
        env:
          IDENTITY_AI_BASE_URL: ${{ secrets.IDENTITY_AI_BASE_URL }}
          IDENTITY_AI_API_KEY: ${{ secrets.IDENTITY_AI_API_KEY }}
          IDENTITY_AI_MODEL: ${{ secrets.IDENTITY_AI_MODEL }}
          IDENTITY_AI_MAX_TOKENS: ${{ secrets.IDENTITY_AI_MAX_TOKENS }}
          IDENTITY_AI_REASONING_EFFORT: ${{ secrets.IDENTITY_AI_REASONING_EFFORT }}
          IDENTITY_AI_FALLBACK_BASE_URL: ${{ secrets.IDENTITY_AI_FALLBACK_BASE_URL }}
          IDENTITY_AI_FALLBACK_API_KEY: ${{ secrets.IDENTITY_AI_FALLBACK_API_KEY }}
          IDENTITY_AI_FALLBACK_MODEL: ${{ secrets.IDENTITY_AI_FALLBACK_MODEL }}
        run: |
          umask 077
          : > deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_BASE_URL "$IDENTITY_AI_BASE_URL" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_API_KEY "$IDENTITY_AI_API_KEY" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_MODEL "$IDENTITY_AI_MODEL" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_MAX_TOKENS "$IDENTITY_AI_MAX_TOKENS" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_REASONING_EFFORT "$IDENTITY_AI_REASONING_EFFORT" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_FALLBACK_BASE_URL "$IDENTITY_AI_FALLBACK_BASE_URL" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_FALLBACK_API_KEY "$IDENTITY_AI_FALLBACK_API_KEY" >> deploy/suggest.env
          printf '%s=%s\n' IDENTITY_AI_FALLBACK_MODEL "$IDENTITY_AI_FALLBACK_MODEL" >> deploy/suggest.env
          chmod 600 deploy/suggest.env
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Deploy
        env:
          TARGET: ${{ secrets.DOCS_DEPLOY_USER }}@${{ secrets.DOCS_DEPLOY_HOST }}
        run: deploy/deploy.sh "$TARGET"

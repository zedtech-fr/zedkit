name: deploy-dev

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to publish to the dev site"
        required: true
        default: "dev"

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Repo-level DOCS_DEPLOY_KEY is the staging key. Do not bind
    # environment: production — that environment holds isolated prod
    # secrets this job must not consume.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record target sha
        run: |
          echo "DEV_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEV_BRANCH=${{ inputs.ref || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Configure SSH to deploy host
        # Reuse DOCS_DEPLOY_KEY (the docs-ci pubkey is authorized on the deploy host).
        # Do not use DOCS_DEPLOY_HOST / DOCS_DEPLOY_USER / DOCS_DEPLOY_KNOWN_HOSTS:
        # those still point at the production docs VM (zedkit.app).
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '195.154.208.75 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDPESq5xmwyuPt3alDGhEe9fE3oOmCDPBt70I8hhylnE' > ~/.ssh/known_hosts
          printf 'Host zed-dev\n  HostName 195.154.208.75\n  User zed\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
      # Gate imports dist-only @zedtech/zedkit-core. postinstall builds seo
      # only; docs prebuild (^... deps) runs after ingest.
      - name: Build core for ingest gate
        run: pnpm --filter @zedtech/zedkit-core build
      - name: Ingest generated run index
        env:
          PUBLIC_REVIEWS_SNAPSHOT: ${{ vars.PUBLIC_REVIEWS_SNAPSHOT }}
          PUBLIC_REVIEWS_SNAPSHOT_REMOTE: ${{ vars.PUBLIC_REVIEWS_SNAPSHOT_REMOTE }}
        run: |
          if [ -z "${PUBLIC_REVIEWS_SNAPSHOT:-}" ]; then
            echo "PUBLIC_REVIEWS_SNAPSHOT unset; keeping stand-in"
            exit 0
          fi
          case "${PUBLIC_REVIEWS_SNAPSHOT}" in
            -*) echo "PUBLIC_REVIEWS_SNAPSHOT must not start with -" >&2; exit 1 ;;
          esac
          if [ -n "${PUBLIC_REVIEWS_SNAPSHOT_REMOTE:-}" ]; then
            case "${PUBLIC_REVIEWS_SNAPSHOT_REMOTE}" in
              -*) echo "PUBLIC_REVIEWS_SNAPSHOT_REMOTE must not start with -" >&2; exit 1 ;;
            esac
            scp "zed-dev:${PUBLIC_REVIEWS_SNAPSHOT_REMOTE}" "${PUBLIC_REVIEWS_SNAPSHOT}"
            scp_status=$?
            if [ "$scp_status" -ne 0 ]; then
              echo "generated run index scp failed (exit ${scp_status}); keeping stand-in"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "generated run index scp failed (exit ${scp_status}); keeping stand-in" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
          fi
          if [ ! -f "${PUBLIC_REVIEWS_SNAPSHOT}" ]; then
            echo "generated run index missing; keeping stand-in"
            exit 0
          fi
          node apps/docs/scripts/copy-public-reviews-snapshot.mjs \
            "${PUBLIC_REVIEWS_SNAPSHOT}" \
            apps/docs/features/reviews/adapters/public-reviews.json
      - run: pnpm --filter @zedtech/zedkit-docs build
      - name: Publish static export
        run: bash deploy/publish-dev-static.sh zed-dev
      - name: Verify dev build stamp
        run: |
          for _ in $(seq 1 8); do
            if curl -sf https://dev.zedkit.app/dev-build.txt | grep -qx "commit=$DEV_SHA"; then
              exit 0
            fi
            sleep 6
          done
          echo "dev-build.txt does not show commit $DEV_SHA" >&2
          curl -sS https://dev.zedkit.app/dev-build.txt >&2 || true
          exit 1

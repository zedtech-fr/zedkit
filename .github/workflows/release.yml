name: release

on:
  push:
    branches: ["main"]

# The Version PR needs contents + pull-requests; npm provenance
# attestation needs id-token. Publishing itself authenticates with
# the NPM_TOKEN secret (see docs/publishing.md).
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets diff against origin/main; a shallow clone
          # without the main branch breaks version computation.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Build BEFORE the action: `changeset publish` packs each package as-is,
      # and npm silently skips missing `files` entries — without this step the
      # tarballs ship without dist/ while `main` points into it (0.1.0 had to
      # be re-released for exactly this).
      - run: pnpm build
      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm exec changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# R6b: docs e2e on Firefox and WebKit (reliability goal). Not a required
# check until 2026-11-07 — see R6b2 to promote into ci-required.
name: nightly-docs-cross-browser

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-docs-cross-browser
  cancel-in-progress: true

jobs:
  docs-e2e-cross-browser:
    name: docs e2e (${{ matrix.browser }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-e2e.log 2>&1 &
          echo $! > /tmp/docs-e2e.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          pnpm --filter @zedtech/zedkit-docs run e2e -- --project=${{ matrix.browser }}
          kill "$(cat /tmp/docs-e2e.pid)"
        env:
          DOCS_E2E_SHARD: ${{ matrix.shard }}
          DOCS_E2E_SHARD_TOTAL: "3"

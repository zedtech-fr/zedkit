# Docs smoke on Firefox and WebKit. Not a required check.
name: nightly-docs-cross-browser

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-docs-cross-browser
  cancel-in-progress: true

jobs:
  docs-smoke-cross-browser:
    name: docs smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-start.log 2>&1 &
          echo $! > /tmp/docs.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          pnpm --filter @zedtech/zedkit-docs run smoke
          kill "$(cat /tmp/docs.pid)"
        env:
          DOCS_E2E_PROJECT: ${{ matrix.browser }}

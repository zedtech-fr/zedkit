packages:
  - "packages/*"

# Shared dependency versions. Workspace manifests reference these with the
# `catalog:` protocol so every package resolves identically. Internal
# workspace links use `workspace:*`.
catalog:
  typescript: 5.9.3
  vitest: 2.1.9
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.72.0
  "@types/node": 22.20.5
  turbo: 2.11.10
  "@changesets/cli": 3.0.3
  ulid: 3.0.2
  "@fastify/static": 10.1.7
  "@nestjs/common": 12.2.0
  "@nestjs/config": 12.0.1
  "@nestjs/core": 12.2.0
  "@nestjs/platform-fastify": 12.2.0
  "@nestjs/swagger": 12.0.4
  "@nestjs/throttler": 6.7.1
  "@swc/core": 1.16.20
  "@types/supertest": 7.2.1
  class-transformer: 0.5.1
  class-validator: 0.15.1
  fastify: 5.12.7
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  reflect-metadata: 0.2.2
  supertest: 7.3.1
  unplugin-swc: 2.0.0

packages:
  - "packages/*"

# Shared dependency versions. Workspace manifests reference these with the
# `catalog:` protocol so every package resolves identically. Internal
# workspace links use `workspace:*`.
catalog:
  typescript: 5.9.3
  vitest: 2.1.9
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.72.0
  "@types/node": 22.20.5
  turbo: 2.11.10
  "@changesets/cli": 3.0.3
